<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💘</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", cursive;
  background: linear-gradient(to bottom, #ffd6e8, #fff0f6);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

#wrapper {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 25px pink;
  z-index: 2;
}

h2 { color: #ff4d88; }

.subir {
  display: inline-block;
  margin: 15px;
  padding: 10px 20px;
  background: #ff85b3;
  color: white;
  border-radius: 15px;
  cursor: pointer;
}

#foto {
  width: 200px;
  border-radius: 20px;
  margin: 15px auto;
  display: none;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px;
}

#yes-btn { background: #ff4d88; color: white; }
#no-btn { background: #999; color: white; position: relative; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.envelope {
  width: 320px;
  height: 220px;
  background: #ff85b3;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff4d88;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  transform-origin: top;
  transition: transform 0.8s;
  z-index: 3;
}

.letter {
  position: absolute;
  width: 260px;
  background: white;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  top: 40px;
  transition: transform 1s ease;
  z-index: 1;
}

.letter img {
  width: 150px;
  border-radius: 15px;
  margin-top: 10px;
}

.open .flap { transform: rotateX(180deg); }
.open .letter { transform: translateY(-180px); z-index: 5; }
  /* 🔥 ARREGLO CARTA GRANDE */
.letter {
  width: 280px !important;
  padding: 20px !important;
  top: 30px !important;
  left: 10px !important;
  z-index: 10 !important;
}

.letter p {
  font-size: 18px !important;
  margin-top: 10px;
}
.open .letter {
  transform: translateY(40px) !important; /* baja la carta */
  z-index: 5;
}


</style>
</head>

<body>

<div id="wrapper">
  <h2>¿Quieres ser mi San Valentín? 💘</h2>

  <input type="file" id="upload" hidden>
  <label for="upload" class="subir">📸Sube tu foto nuestra favorita</label>

  <img id="foto">

  <div>
    <button id="yes-btn">Sí 💖</button>
    <button id="no-btn">No 💔</button>
  </div>
</div>

<div id="overlay">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="letter">
      <h3>💌Para Mike</h3>
      <p>Te amare incluso cuando nos odiemos. Ninguno huirá, no importa lo que pase. Nos cuidaremos hasta que seamos ancianos, malolientes y seniles.💕</p>
      <p>El domingo tendremos una cita💗</p>
      <img id="fotoCarta">
    </div>
  </div>
</div>

<audio id="music" src="musica.mp3"></audio>

<script>
const upload = document.getElementById("upload");
const foto = document.getElementById("foto");
const fotoCarta = document.getElementById("fotoCarta");
const yesBtn = document.getElementById("yes-btn");
const noBtn = document.getElementById("no-btn");
const overlay = document.getElementById("overlay");
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");

upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    foto.src = url;
    foto.style.display = "block";
    fotoCarta.src = url;
  }
});

function moveButton() {
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random()*70 + "%";
  noBtn.style.top = Math.random()*70 + "%";
}
noBtn.addEventListener("mouseover", moveButton);

yesBtn.addEventListener("click", () => {
  overlay.style.display = "flex";
});

envelope.addEventListener("click", () => {
  envelope.classList.add("open");
  music.play();
});
</script>

</body>
</html>
