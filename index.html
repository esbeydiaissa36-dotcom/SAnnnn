<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💘</title>

<!-- Fuentes Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Comfortaa&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: linear-gradient(to bottom, #ffd6e8, #fff0f6);
  overflow-x: hidden;
  overflow-y: auto;
  padding: 20px 0;
  font-family: 'Comfortaa', cursive; /* Por defecto para todo el body */
}

#wrapper {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 25px pink;
  margin: 0 auto 30px auto;
}

h2 { 
  color: #ff4d88; 
  font-family: 'Comfortaa', cursive; /* Título divertido y legible */ 
}

.subir {
  display: inline-block;
  margin: 15px;
  padding: 10px 20px;
  background: #ff85b3;
  color: white;
  border-radius: 15px;
  cursor: pointer;
  font-family: 'Comfortaa', cursive; /* Botón/sube tu foto */
}

#foto {
  width: 200px;
  border-radius: 20px;
  margin: 15px auto;
  display: none;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px;
  font-family: 'Comfortaa', cursive; /* Botones */
}

#yes-btn { background: #ff4d88; color: white; }
#no-btn { background: #999; color: white; position: relative; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.3);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 999;
  overflow: visible;
}

.envelope {
  width: 320px;
  height: 280px;
  background: #ff85b3;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff4d88;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  transform-origin: top;
  transition: transform 0.8s;
  z-index: 3;
}

.letter {
  position: absolute;
  width: 280px;
  max-width: 90vw;
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  transition: transform 1s ease, opacity 1s ease;
  z-index: 5;
  font-family: 'Dancing Script', cursive; /* Fuente romántica para la carta */
  font-size: 18px;
}

.letter img {
  width: 150px;
  max-width: 80%;
  border-radius: 15px;
  margin-top: 10px;
}

.open .flap { transform: rotateX(180deg); }
.open .letter { 
  transform: translate(-50%, -50%) scale(1); 
  opacity: 1;
}

/* 💗 corazones glowy flotando */
.heart {
  position: fixed;
  bottom: 0;
  font-size: 24px;
  color: #ff66cc;
  text-shadow: 0 0 8px #ff66cc, 0 0 15px #ff99ff;
  pointer-events: none;
  animation-name: rise;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity: 0.9; }
  100% { transform: translateY(-120vh) scale(1); opacity: 0; }
}
</style>
</head>

<body>

<div id="wrapper">
  <h2>¿Quieres ser mi San Valentín? 💘</h2>

  <input type="file" id="upload" hidden>
  <label for="upload" class="subir">📸Sube tu foto favorita</label>

  <img id="foto">

  <div>
    <button id="yes-btn">Sí 💖</button>
    <button id="no-btn">No 💔</button>
  </div>
</div>

<div id="overlay">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="letter">
      <h3>💌Para Mike</h3>
      <p>Te amare incluso cuando nos odiemos. Ninguno huirá, no importa lo que pase. Nos cuidaremos hasta que seamos ancianos, malolientes y seniles.💗</p>
      <img id="fotoCarta">
    </div>
  </div>
</div>

<audio id="music" src="Mia & Sebastian’s Theme [Wk7RrtEGDyo].mp3"></audio>

<script>
const upload = document.getElementById("upload");
const foto = document.getElementById("foto");
const fotoCarta = document.getElementById("fotoCarta");
const yesBtn = document.getElementById("yes-btn");
const noBtn = document.getElementById("no-btn");
const overlay = document.getElementById("overlay");
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");

// Subir foto
upload.addEventListener("change", () => {
  const file = upload.files[0];
  if(file){
    const url = URL.createObjectURL(file);
    foto.src = url;
    foto.style.display = "block";
    fotoCarta.src = url;
  }
});

// Botón No
function moveButton() {
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random()*70 + "%";
  noBtn.style.top = Math.random()*70 + "%";
}
noBtn.addEventListener("mouseover", moveButton);

// Botón Sí muestra overlay
yesBtn.addEventListener("click", () => {
  overlay.style.display = "flex";
});

// Abrir sobre y corazones glowy
envelope.addEventListener("click", () => {
  envelope.classList.add("open");
  music.play();

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "💗";

    const size = Math.random()*24 + 16; 
    heart.style.fontSize = size + "px";

    heart.style.left = Math.random()*100 + "vw";

    const duration = Math.random()*4 + 3; 
    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);
    heart.addEventListener("animationend", ()=> heart.remove());
  }

  const interval = setInterval(createHeart, 300);
  setTimeout(()=> clearInterval(interval), 10*60*1000); 
});
</script>

</body>
</html>
