<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💘</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", cursive;
  background: linear-gradient(to bottom, #ffd6e8, #fff0f6);
  display: block;
  overflow: auto;
  padding: 20px 0;
}

#wrapper {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 25px pink;
  margin: 0 auto 30px auto;
}

h2 { color: #ff4d88; }

.subir {
  display: inline-block;
  margin: 15px;
  padding: 10px 20px;
  background: #ff85b3;
  color: white;
  border-radius: 15px;
  cursor: pointer;
}

#foto {
  width: 200px;
  border-radius: 20px;
  margin: 15px auto;
  display: none;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px;
}

#yes-btn { background: #ff4d88; color: white; }
#no-btn { background: #999; color: white; position: relative; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; /* comienza oculto */
  justify-content: center;
  align-items: flex-start;
  padding-top: 50px;
  z-index: 999;
}

.envelope {
  width: 320px;
  height: 280px;
  background: #ff85b3;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff4d88;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  transform-origin: top;
  transition: transform 0.8s;
  z-index: 3;
}

.letter {
  position: absolute;
  width: 280px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  top: 40px;
  opacity: 0; /* invisible hasta abrir flap */
  transform: translateY(50px) scale(0.8);
  transition: transform 1s ease, opacity 1s ease;
  z-index: 1;
}

.letter img {
  width: 150px;
  border-radius: 15px;
  margin-top: 10px;
}

.open .flap { transform: rotateX(180deg); }
.open .letter { 
  transform: translateY(-140px) scale(1); 
  opacity: 1; 
  z-index: 5;
}

.letter p {
  font-size: 18px;
  margin-top: 10px;
}

/* Burbujas por toda la página */
.bubble {
  position: fixed;
  bottom: 0;
  background: rgba(255, 200, 255, 0.7);
  border-radius: 50%;
  opacity: 0.8;
  animation: rise 4s linear forwards;
  pointer-events: none;
}

@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
  100% { transform: translateY(-300px) scale(1); opacity: 0; }
}
</style>
</head>
