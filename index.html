<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>San Valentín 💖</title>

  <!-- CSS -->
  <link rel="stylesheet" href="sanvalentin.css" />
</head>

<body>

  <div id="wrapper">
    <h2>¿Quieres ser mi San Valentín? 💘</h2>

    <label class="subir">
      📷 Sube nuestra foto
      <input type="file" id="upload" hidden />
    </label>

    <img id="foto" src="" />

    <div id="btn-group">
      <button id="yes-btn">Sí 💖</button>
      <button id="no-btn">No 💔</button>
    </div>

    <div id="carta" style="display:none;">
      <h3>Sabía que dirías que sí 😍</h3>
      <p>
        Eres mi persona favorita en todo el universo 💗  
        Gracias por estar conmigo.  
        Te amo muchísimo 💞
      </p>
      <img id="fotoCarta" src="" />
    </div>
  </div>

  <!-- Corazones flotando -->
  <div class="bubbles">
    <span>💗</span>
    <span>💖</span>
    <span>💘</span>
    <span>💝</span>
    <span>💕</span>
    <span>💞</span>
    <span>❤️</span>
  </div>

  <!-- JS -->
  <script src="sanvalentin.js"></script>

</body>
</html>
