<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💘</title>
<link rel="stylesheet" href="sanvalentin.css">
</head>

<body>

<div id="wrapper">
  <h2 id="question">¿Quieres ser mi San Valentín? 💘</h2>

  <input type="file" id="upload" hidden>
  <label for="upload" class="subir">📸 Sube nuestra foto</label>

  <img id="foto">

  <div class="buttons">
    <button id="yes-btn">Sí 💖</button>
    <button id="no-btn">No 💔</button>
  </div>
</div>

<!-- 💌 SOBRE -->
<div id="overlay">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="letter">
      <h3>💌 Para ti</h3>
      <p>Tendremos una cita el domingo 💕</p>
      <img id="fotoCarta">
    </div>
  </div>
</div>

<!-- 🎵 Música -->

  <audio id="music" src="musica.mp3"></audio>
<script src="sanvalentin.js"></script>
</body>
</html>
