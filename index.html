<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💘</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", cursive;
  background: linear-gradient(to bottom, #ffd6e8, #fff0f6);
  display: block; /* permite scroll */
  overflow: auto;
  padding: 20px 0;
}

#wrapper {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 25px pink;
  margin: 0 auto 30px auto;
}

h2 { color: #ff4d88; }

.subir {
  display: inline-block;
  margin: 15px;
  padding: 10px 20px;
  background: #ff85b3;
  color: white;
  border-radius: 15px;
  cursor: pointer;
}

#foto {
  width: 200px;
  border-radius: 20px;
  margin: 15px auto;
  display: none;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px;
}

#yes-btn { background: #ff4d88; color: white; }
#no-btn { background: #999; color: white; position: relative; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 50px;
  z-index: 999;
}

.envelope {
  width: 320px;
  height: 280px;
  background: #ff85b3;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff4d88;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  transform-origin: top;
  transition: transform 0.8s;
  z-index: 3;
}

.letter {
  position: absolute;
  width: 280px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  top: 40px;
  opacity: 0; /* invisible al inicio */
  transform: translateY(50px) scale(0.8);
  transition: transform 1s ease, opacity 1s ease;
  z-index: 1;
}

.letter img {
  width: 150px;
  border-radius: 15px;
  margin-top: 10px;
}

.open .flap { transform: rotateX(180deg); }
.open .letter { 
  transform: translateY(-140px) scale(1); 
  opacity: 1; 
  z-index: 5;
}

.letter p {
  font-size: 18px;
  margin-top: 10px;
}

/* Burbujas */
#bubbles {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 4;
}

.bubble {
  position: absolute;
  bottom: 0;
  background: rgba(255, 200, 255, 0.7);
  border-radius: 50%;
  opacity: 0.8;
  animation: rise 4s linear forwards;
}

@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
  100% { transform: translateY(-300px) scale(1); opacity: 0; }
}

</style>
</head>

<body>

<div id="wrapper">
  <h2>¿Quieres ser mi San Valentín? 💘</h2>

  <input type="file" id="upload" hidden>
  <label for="upload" class="subir">📸Sube tu foto nuestra favorita</label>

  <img id="foto">

  <div>
    <button id="yes-btn">Sí 💖</button>
    <button id="no-btn">No 💔</button>
  </div>
</div>

<div id="overlay">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="letter">
      <h3>💌Para Mike</h3>
      <p>Te amare incluso cuando nos odiemos. Ninguno huirá, no importa lo que pase. Nos cuidaremos hasta que seamos ancianos, malolientes y seniles.💕</p>
      <p>El domingo tendremos una cita💗</p>
      <img id="fotoCarta">
    </div>
    <div id="bubbles"></div>
  </div>
</div>

<audio id="music" src="musica.mp3"></audio>

<script>
const upload = document.getElementById("upload");
const foto = document.getElementById("foto");
const fotoCarta = document.getElementById("fotoCarta");
const yesBtn = document.getElementById("yes-btn");
const noBtn = document.getElementById("no-btn");
const overlay = document.getElementById("overlay");
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");

upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    foto.src = url;
    foto.style.display = "block";
    fotoCarta.src = url;
  }
});

function moveButton() {
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random()*70 + "%";
  noBtn.style.top = Math.random()*70 + "%";
}
noBtn.addEventListener("mouseover", moveButton);

yesBtn.addEventListener("click", () => {
  overlay.style.display = "flex";
});

envelope.addEventListener("click", () => {
  envelope.classList.add("open");
  music.play();

  // Crear burbujas
  const bubblesContainer = document.getElementById("bubbles");
  for (let i = 0; i < 20; i++) {
    const bubble = document.createElement("div");
    bubble.classList.add("bubble");
    bubble.style.width = bubble.style.height = (Math.random() * 20 + 10) + "px";
    bubble.style.left = Math.random() * 100 + "%";
    bubble.style.animationDuration = (Math.random() * 2 + 3) + "s";
    bubblesContainer.appendChild(bubble);

    // eliminar burbuja después de la animación
    bubble.addEventListener("animationend", () => bubble.remove());
  }
});
</script>

</body>
</html>
